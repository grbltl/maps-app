<!DOCTYPE html>
<html>
<head>
  <title>Interactive Map</title>
  <!-- Load MapLibre CSS securely over CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.0/maplibre-gl.css" />
  
  <style>
    /* Force the map to fill the entire browser screen viewport layout */
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>

  <!-- The single, clean anchor container element -->
  <div id="map"></div>

  <!-- Load MapLibre JS Core Engine securely over CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.0/maplibre-gl.js"></script>

  <script>
    // 1. Initialize the map instantly at a full world globe layout view (Zoom 1)
    var map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright', 
      center: [0, 20],        // VERIFIED: Proper global baseline coordinate center values
      zoom: 1,                // Maximum zoom-out to show the full planet layout
      attributionControl: false
    });

    // 2. Wait until the map engine finishes loading the base globe map layers
    map.on('load', function() {
      
      // Check if the browser supports standard Geolocation API structure
      if (navigator.geolocation) {
        
        navigator.geolocation.getCurrentPosition(
          // SUCCESS FLOW: The user clicked "Allow"
          function(position) {
            var lng = position.coords.longitude;
            var lat = position.coords.latitude;

            // Add a clean blue location marker point over your position
            new maplibregl.Marker({ color: '#007AFF' })
              .setLngLat([lng, lat])
              .addTo(map);

            // Execute a smooth, cinematic flight animation from space down to your street
            map.flyTo({
              center: [lng, lat],
              zoom: 15,          // Dense street level zoom setting
              essential: true,   // Ensures the animation runs smoothly on mobile performance pipelines
              duration: 3500     // Smooth 3.5-second flight execution duration
            });
          },
          // DENIED FLOW: The user clicked "Block/Deny" or the request timed out
          function(error) {
            console.log("Location access permission denied. Map remaining stationary at globe view.");
            // Do absolutely nothing. The map naturally stays frozen at the Zoom 1 globe layout.
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
        
      } else {
        console.log("This browser configuration does not support geolocation tracking pipelines.");
      }
    });
  </script>

</body>
</html>
