<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!-- Phone browsers otherwise lay the page out at ~980px and let the whole
       page be pinch-zoomed; only the map should zoom (see MainPage). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- The map can't draw until a chain of requests to OpenFreeMap finishes
       (style -> tile index -> tiles/fonts/icons). Open the connection and
       start fetching the style while our JS is still downloading.
       The style URL must match STYLE_URL in MapLibreMapAdapter.ts, and
       crossorigin="anonymous" must match how MapLibre fetches it, or the
       browser downloads it a second time. -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin="anonymous" />
  <link rel="preload" href="https://tiles.openfreemap.org/styles/bright" as="fetch" crossorigin="anonymous" />
  <!-- Inline so it paints before any JS/CSS loads.
       - #app (the map's frame) gets the style's water color: the start
         screen is the world map, mostly ocean, so it's not a blank white
         screen while the map's requests finish.
       - html/body get a neutral light/dark gray: Safari tints its status-bar
         strip from the page background (and theme-color below), so the
         strip follows light/dark mode like Safari's own toolbars. -->
  <style>
    html, body { background: #f7f7f7; }
    #app { background: #aecfe2; }
    @media (prefers-color-scheme: dark) { html, body { background: #1c1c1e; } }
  </style>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
  <!-- Opened from the Home Screen, run without Safari's bars, with iOS's
       standard status bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Interactive Map</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
