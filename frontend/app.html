<!DOCTYPE html>
<html>
<head>
  <title>Interactive Map</title>
  <!-- Load MapLibre CSS securely over CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.0/maplibre-gl.css" />

  <style>
    /* Force the map to fill the entire browser screen viewport layout */
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: calc(100% - 24px);
      box-sizing: border-box;
    }

    #address-input {
      flex: 1 1 220px;
      min-width: 160px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #controls button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
      white-space: nowrap;
    }

    #controls button:hover { background: #e8e8e8; }

    #status {
      flex-basis: 100%;
      color: #b00020;
      min-height: 1em;
    }

    body.modal-open { overflow: hidden; }

    #modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }

    #modal-backdrop.hidden { display: none; }

    #modal {
      position: relative;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      padding: 20px;
      /* Fixed footprint: the box never grows or shrinks to fit its content.
         Any overflow (e.g. a long address) scrolls inside instead. */
      width: 320px;
      height: 240px;
      max-width: calc(100% - 32px);
      max-height: calc(100% - 32px);
      overflow-y: auto;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #f0f0f0;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    #modal-close:hover { background: #e0e0e0; }

    #modal-title {
      margin: 0 28px 16px 0;
      font-size: 18px;
    }

    #modal-details p { margin: 0 0 16px; color: #444; font-size: 14px; line-height: 1.3; }
    #modal-details p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>

  <div id="controls">
    <form id="address-form" style="display: contents;">
      <input id="address-input" type="text" placeholder="Enter a full address" autocomplete="off" />
      <button type="submit">Search</button>
    </form>
    <button id="locate-btn" type="button">Use current location</button>
    <div id="status"></div>
  </div>

  <!-- The single, clean anchor container element -->
  <div id="map"></div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" type="button" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-details"></div>
    </div>
  </div>

  <!-- Load MapLibre JS Core Engine securely over CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.0/maplibre-gl.js"></script>

  <script>
    // 1. Initialize the map instantly at a full world globe layout view (Zoom 1)
    var map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [0, 20],        // VERIFIED: Proper global baseline coordinate center values
      zoom: 1,                // Maximum zoom-out to show the full planet layout
      attributionControl: false
    });

    // Restrict the base style's POI symbol layers to restaurants only. All POI
    // categories (bus stops, hospitals, hardware stores, parks, restaurants...)
    // share one "poi" source-layer and are split into these rank-based layers,
    // distinguished only by a "class" property - so we narrow the filter rather
    // than removing the layers. poi_transit (bus/rail/airport) never contains
    // restaurants, so it's dropped outright.
    var RESTAURANT_LAYERS = ['poi_r1', 'poi_r7', 'poi_r20'];

    map.on('load', function() {
      RESTAURANT_LAYERS.forEach(function(id) {
        var existingFilter = map.getFilter(id);
        map.setFilter(id, ['all', existingFilter, ['==', ['get', 'class'], 'restaurant']]);
      });
      if (map.getLayer('poi_transit')) map.removeLayer('poi_transit');

      // Clicking a restaurant marker opens the info modal; hover shows a pointer
      // cursor so it's clear the marker is interactive.
      RESTAURANT_LAYERS.forEach(function(id) {
        map.on('click', id, function(e) {
          showRestaurantModal(e.features[0]);
        });
        map.on('mouseenter', id, function() { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', id, function() { map.getCanvas().style.cursor = ''; });
      });
    });

    var marker = null; // reused across searches so results don't stack up
    var statusEl = document.getElementById('status');

    function setStatus(message) {
      statusEl.textContent = message || '';
    }

    // Cache of the visitor's own position, used both by "Use current location"
    // and by the modal's distance line, so we only ever prompt for geolocation
    // once per session.
    var currentLocation = null; // { lng, lat }

    function getCurrentLocation() {
      if (currentLocation) return Promise.resolve(currentLocation);
      if (!navigator.geolocation) return Promise.reject(new Error('Geolocation unsupported'));

      return new Promise(function(resolve, reject) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            currentLocation = { lng: position.coords.longitude, lat: position.coords.latitude };
            resolve(currentLocation);
          },
          reject,
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    // Great-circle (straight-line) distance in miles. Pure math on two already-
    // known coordinate pairs - negligible CPU cost and no network round trip,
    // unlike driving time, which would require calling an external routing
    // service (e.g. OSRM) for every restaurant clicked. That's why distance is
    // shown here instead of (or in addition to) drive time.
    function haversineDistanceMiles(lat1, lon1, lat2, lon2) {
      var toRad = function(d) { return d * Math.PI / 180; };
      var R = 3958.8;
      var dLat = toRad(lat2 - lat1);
      var dLon = toRad(lon2 - lon1);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistanceMiles(miles) {
      return miles.toFixed(1) + ' mi away';
    }

    // --- Restaurant info modal ---------------------------------------------

    var modalBackdrop = document.getElementById('modal-backdrop');
    var modalTitle = document.getElementById('modal-title');
    var modalDetails = document.getElementById('modal-details');
    var modalRequestId = 0; // guards against a stale reverse-geocode reply overwriting a newer click

    // Each entry becomes its own <p> (normal spacing between entities - e.g.
    // distance, address, phone). An entry that's itself an array (the address)
    // renders as one <p> with <br> between its lines, for tight spacing within
    // that single entity.
    function setModalDetailLines(entries) {
      while (modalDetails.firstChild) modalDetails.removeChild(modalDetails.firstChild);
      entries.forEach(function(entry) {
        var p = document.createElement('p');
        var sublines = Array.isArray(entry) ? entry : [entry];
        sublines.forEach(function(text, i) {
          if (i > 0) p.appendChild(document.createElement('br'));
          p.appendChild(document.createTextNode(text));
        });
        modalDetails.appendChild(p);
      });
    }

    function openModal() {
      modalBackdrop.classList.remove('hidden');
      document.body.classList.add('modal-open');
      // Prevent the map underneath the modal from panning/zooming while it's open.
      map.scrollZoom.disable();
      map.dragPan.disable();
      map.touchZoomRotate.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
    }

    function closeModal() {
      modalBackdrop.classList.add('hidden');
      document.body.classList.remove('modal-open');
      map.scrollZoom.enable();
      map.dragPan.enable();
      map.touchZoomRotate.enable();
      map.doubleClickZoom.enable();
      map.boxZoom.enable();
      map.keyboard.enable();
    }

    var US_STATE_ABBREVIATIONS = {
      'Alabama': 'AL', 'Alaska': 'AK', 'Arizona': 'AZ', 'Arkansas': 'AR', 'California': 'CA',
      'Colorado': 'CO', 'Connecticut': 'CT', 'Delaware': 'DE', 'District of Columbia': 'DC',
      'Florida': 'FL', 'Georgia': 'GA', 'Hawaii': 'HI', 'Idaho': 'ID', 'Illinois': 'IL',
      'Indiana': 'IN', 'Iowa': 'IA', 'Kansas': 'KS', 'Kentucky': 'KY', 'Louisiana': 'LA',
      'Maine': 'ME', 'Maryland': 'MD', 'Massachusetts': 'MA', 'Michigan': 'MI', 'Minnesota': 'MN',
      'Mississippi': 'MS', 'Missouri': 'MO', 'Montana': 'MT', 'Nebraska': 'NE', 'Nevada': 'NV',
      'New Hampshire': 'NH', 'New Jersey': 'NJ', 'New Mexico': 'NM', 'New York': 'NY',
      'North Carolina': 'NC', 'North Dakota': 'ND', 'Ohio': 'OH', 'Oklahoma': 'OK', 'Oregon': 'OR',
      'Pennsylvania': 'PA', 'Rhode Island': 'RI', 'South Carolina': 'SC', 'South Dakota': 'SD',
      'Tennessee': 'TN', 'Texas': 'TX', 'Utah': 'UT', 'Vermont': 'VT', 'Virginia': 'VA',
      'Washington': 'WA', 'West Virginia': 'WV', 'Wisconsin': 'WI', 'Wyoming': 'WY',
      'Puerto Rico': 'PR', 'Guam': 'GU', 'American Samoa': 'AS',
      'United States Virgin Islands': 'VI', 'Northern Mariana Islands': 'MP'
    };

    var STREET_SUFFIX_ABBREVIATIONS = {
      street: 'St', avenue: 'Ave', boulevard: 'Blvd', drive: 'Dr', road: 'Rd',
      lane: 'Ln', court: 'Ct', place: 'Pl', highway: 'Hwy', parkway: 'Pkwy',
      circle: 'Cir', terrace: 'Ter', trail: 'Trl', square: 'Sq', plaza: 'Plz'
    };

    function abbreviateStreetSuffix(road) {
      if (!road) return road;
      var words = road.split(' ');
      var last = words[words.length - 1].toLowerCase();
      if (STREET_SUFFIX_ABBREVIATIONS[last]) words[words.length - 1] = STREET_SUFFIX_ABBREVIATIONS[last];
      return words.join(' ');
    }

    // Returns ["street line", "City, ST zip"] in standard US mailing-address
    // form (state abbreviated, no comma between state and zip). Built from
    // structured fields rather than Nominatim's display_name, which leads with
    // the POI's own name (the same "amenity" address component we already show
    // as the modal title) and would otherwise duplicate it on the address line.
    function formatAddressLines(address) {
      if (!address) return null;

      var street = [address.house_number, abbreviateStreetSuffix(address.road)].filter(Boolean).join(' ');
      if (address.unit) street += ' Suite ' + address.unit;

      var locality = address.city || address.town || address.village || address.suburb || address.neighbourhood;

      if (address.country_code === 'us') {
        var state = US_STATE_ABBREVIATIONS[address.state] || address.state;
        var cityStateZip = [locality, [state, address.postcode].filter(Boolean).join(' ')]
          .filter(Boolean).join(', ');
        var usLines = [street, cityStateZip].filter(Boolean);
        return usLines.length ? usLines : null;
      }

      // Non-US: no standard state-abbreviation convention, so keep the state
      // name and include the country.
      var region = [address.state, address.postcode].filter(Boolean).join(' ');
      var lines = [street, [locality, region].filter(Boolean).join(', '), address.country].filter(Boolean);
      return lines.length ? lines : null;
    }

    // Address/phone (reverse geocode) and distance (geolocation) load
    // independently and at different speeds, so each is rendered as soon as
    // it resolves rather than waiting on the other - renderModalBody always
    // reflects whatever part of modalState is known so far.
    function renderModalBody(state) {
      var lines = [];
      if (state.distanceLoading) {
        lines.push('Finding distance...');
      } else if (state.distanceLine) {
        lines.push(state.distanceLine);
      }
      if (state.addressLoading) {
        lines.push('Loading...');
      } else {
        lines.push(state.addressLines); // one entity: street + city/state/zip, tight spacing
        if (state.phone) lines.push(state.phone);
      }
      setModalDetailLines(lines);
    }

    function showRestaurantModal(feature) {
      var props = feature.properties || {};
      var coords = feature.geometry.coordinates;
      var lng = coords[0], lat = coords[1];
      var requestId = ++modalRequestId;

      var state = {
        addressLoading: true,
        addressLines: null,
        phone: null,
        distanceLoading: !!navigator.geolocation,
        distanceLine: null
      };

      modalTitle.textContent = props.name || 'Restaurant';
      renderModalBody(state);
      openModal();

      var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1&extratags=1';
      fetch(url, { headers: { Accept: 'application/json' } })
        .then(function(response) {
          if (!response.ok) throw new Error('Reverse geocoding failed');
          return response.json();
        })
        .then(function(data) {
          if (requestId !== modalRequestId) return; // a newer click superseded this one
          state.addressLoading = false;
          state.addressLines = formatAddressLines(data && data.address) || [(data && data.display_name) || 'Address unavailable.'];
          state.phone = data && data.extratags && (data.extratags.phone || data.extratags['contact:phone']);
          renderModalBody(state);
        })
        .catch(function() {
          if (requestId !== modalRequestId) return;
          state.addressLoading = false;
          state.addressLines = ['Address unavailable.'];
          renderModalBody(state);
        });

      if (navigator.geolocation) {
        getCurrentLocation()
          .then(function(loc) {
            if (requestId !== modalRequestId) return;
            state.distanceLoading = false;
            state.distanceLine = formatDistanceMiles(haversineDistanceMiles(loc.lat, loc.lng, lat, lng));
            renderModalBody(state);
          })
          .catch(function() {
            if (requestId !== modalRequestId) return;
            state.distanceLoading = false;
            state.distanceLine = null; // location denied/unavailable - omit the line
            renderModalBody(state);
          });
      }
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);

    // Restaurant markers are split across minzoom tiers in the style (poi_r1
    // from z15, poi_r7 - the bulk of ordinary restaurants - only from z16,
    // poi_r20 from z17). That's a pure rendering cutoff, not a network/tile
    // cost, so landing one tier higher doesn't cost any load time - it just
    // shows what was already there. Land at z16 so restaurants are visible
    // without an extra manual zoom step.
    var DEFAULT_ZOOM = 16;

    // Drop/move the marker and fly the camera to the given coordinates
    function goToLocation(lng, lat, zoom) {
      if (!marker) {
        marker = new maplibregl.Marker({ color: '#007AFF' }).setLngLat([lng, lat]).addTo(map);
      } else {
        marker.setLngLat([lng, lat]);
      }

      map.flyTo({
        center: [lng, lat],
        zoom: zoom,
        essential: true,
        speed: 0.8,       // lower = more cinematic; duration now scales with distance
        curve: 1.42,      // MapLibre default "swoop" shape (zoom out, pan, zoom in)
        maxDuration: 6000 // cap so far-away addresses don't fly forever
      });
    }

    // Look up a free-text address via OpenStreetMap's Nominatim geocoder
    function searchAddress(address) {
      setStatus('Searching...');
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);

      fetch(url, { headers: { Accept: 'application/json' } })
        .then(function(response) {
          if (!response.ok) throw new Error('Geocoding request failed');
          return response.json();
        })
        .then(function(results) {
          if (!results || results.length === 0) {
            setStatus('No results found for that address.');
            return;
          }
          setStatus('');
          var lng = parseFloat(results[0].lon);
          var lat = parseFloat(results[0].lat);
          // The first address typed, if the visitor hasn't already shared their
          // location via the browser, doubles as "where I am" for the distance
          // line in the restaurant modal - same one-time-per-reload rule as
          // geolocation: once set, later searches don't overwrite it.
          if (!currentLocation) currentLocation = { lng: lng, lat: lat };
          goToLocation(lng, lat, DEFAULT_ZOOM);
        })
        .catch(function() {
          setStatus('Could not look up that address. Please try again.');
        });
    }

    // Use the browser Geolocation API to find and fly to the visitor's position
    function useCurrentLocation() {
      if (!navigator.geolocation) {
        setStatus('This browser does not support geolocation.');
        return;
      }

      setStatus('Locating...');

      getCurrentLocation()
        .then(function(loc) {
          setStatus('');
          goToLocation(loc.lng, loc.lat, DEFAULT_ZOOM);
        })
        .catch(function() {
          setStatus('Location access denied or unavailable.');
        });
    }

    document.getElementById('address-form').addEventListener('submit', function(event) {
      event.preventDefault();
      var address = document.getElementById('address-input').value.trim();
      if (address) searchAddress(address);
    });

    document.getElementById('locate-btn').addEventListener('click', useCurrentLocation);
  </script>

</body>
</html>
